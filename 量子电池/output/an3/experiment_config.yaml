data:
  num_trajectories: 500
  output_dir: output/an3/data
  param_grid:
    coupling_strength:
    - 0.02
    - 0.04
    - 0.06
    - 0.08
    - 0.1
    - 0.12
    - 0.15
    - 0.18
    - 0.2
    - 0.25
    - 0.3
    - 0.35
    - 0.4
    - 0.45
    - 0.5
    spectral_width:
    - 0.02
    - 0.03
    - 0.05
    - 0.07
    - 0.08
    - 0.1
    - 0.12
    - 0.15
    - 0.2
    - 0.3
    - 0.5
    - 0.8
    - 1.0
    - 1.5
    - 2.0
  train_split: 0.8
  window_size: 100
heom:
  max_depth: 10
  time_step: 0.05
  total_time: 15.0
loss:
  lambda_herm: 1.0
  lambda_pos: 0.1
  lambda_trace: 1.0
model:
  dropout: 0.2
output:
  log_dir: ./logs
  model_dir: ./models
  plot_dir: ./plots
physics:
  center_frequency: 1.0
  coupling_strength: 0.1
  drive_amplitude: 1.0
  num_tls: 3
  omega_0: 1.0
  spectral_width: 0.5
  temperature: 0.0
training:
  batch_size: 64
  early_stop_patience: 30
  epochs: 200
  learning_rate: 0.001
  lr_scheduler:
    factor: 0.5
    patience: 10
  seed: 42
  weight_decay: 0.0001
